<header class="topbar">
  <nav class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}#top">{{ site.short_title }}</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      {% for item in site.nav %}
      {% if item.url %}
      <li><a class="nav-page{% if page.url == item.url %} active{% endif %}" href="{{ item.url | relative_url }}">{{ item.label }}</a></li>
      {% else %}
      <li><a href="{{ '/' | relative_url }}#{{ item.id }}">{{ item.label }}</a></li>
      {% endif %}
      {% endfor %}
    </ul>
  </nav>
</header>
